<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09020a">
<meta name="description" content="Una galaxia de estrellas rosas, un corazón de luz y un universo de razones para amarte. Explórala con tus dedos.">
<title>Te Amo · Nuestro universo</title>
<style>
:root{color-scheme:dark;--pink:#ff65bd;--white:#fff0f8;--muted:#d2adc6}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050208;color:var(--white)}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#05020880 100%)}header{position:fixed;top:max(24px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none}h1{margin:0;font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(30px,4vw,46px);letter-spacing:.02em;text-shadow:0 0 24px #ff289080}h1 svg{width:30px;height:30px;margin-left:10px;vertical-align:-3px;filter:drop-shadow(0 0 9px #ff228a)}.subtitle{margin:9px 0 0;font-size:10px;font-weight:500;letter-spacing:.32em;color:#e0afcf;text-transform:uppercase}.bottom{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:center;flex-direction:column;gap:14px;pointer-events:none}.hint{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:0;transition:opacity 1s}.toolbar{display:flex;gap:6px;padding:5px;border-radius:30px;border:1px solid #ffc0e52b;background:#170c20ad;backdrop-filter:blur(14px);pointer-events:auto;box-shadow:0 5px 30px #0004}button{background:none;border:0;color:var(--white);width:44px;height:44px;display:grid;place-items:center;border-radius:50%;cursor:pointer;transition:background .2s,transform .2s}button:hover{background:#ff65bd24;transform:translateY(-2px)}button:focus-visible{outline:2px solid var(--pink);outline-offset:3px}button[aria-pressed="true"]{background:#ff65bd25;color:#ffa2d7}button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.divider{width:1px;background:#ffbde322;margin:9px 3px}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;clip:rect(0,0,0,0);overflow:hidden}.message{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .8s}.message.active{opacity:1}.message span{padding:22px 34px;text-align:center;font:italic clamp(25px,5vw,46px) Georgia,serif;color:#fff1fa;text-shadow:0 0 10px #ff58bd,0 0 40px #ff1493;background:radial-gradient(ellipse,#180719dd,transparent 70%)}.loading{position:fixed;inset:0;display:grid;place-items:center;background:#050208;transition:opacity 1s;pointer-events:none;font:italic 24px Georgia,serif}.loading.ready{opacity:0}@media(max-width:600px){header{top:max(27px,env(safe-area-inset-top))}.subtitle{font-size:9px;letter-spacing:.25em}.bottom{bottom:max(20px,env(safe-area-inset-bottom))}.hint{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<canvas id="universe" tabindex="0" aria-label="Galaxia rosa interactiva con un corazón luminoso. Arrastra para girar, usa las flechas para mover y más o menos para acercarte."></canvas>
<div class="vignette"></div>
<header><h1>Te Amo<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff268d" d="M12 21C9 18 2 13 2 7a5 5 0 0 1 10-1A5 5 0 0 1 22 7c0 6-7 11-10 14Z"/></svg></h1><p class="subtitle">En este y en todos los universos</p></header>
<div class="bottom"><p class="hint" id="hint">Arrastra para explorar · Pellizca para acercarte</p><nav class="toolbar" aria-label="Controles del universo">
<button id="motion" title="Pausar movimiento" aria-label="Pausar movimiento" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
<button id="zoomIn" title="Acercar" aria-label="Acercar"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5M7 10h6M10 7v6"/></svg></button>
<button id="zoomOut" title="Alejar" aria-label="Alejar"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5M7 10h6"/></svg></button>
<div class="divider"></div>
<button id="reset" title="Volver al inicio" aria-label="Volver al inicio"><svg viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg></button>
<button id="love" title="Una razón para amarte" aria-label="Mostrar una razón para amarte"><svg viewBox="0 0 24 24"><path d="M12 20S3 14.8 3 8.5a4.6 4.6 0 0 1 9-1.3 4.6 4.6 0 0 1 9 1.3C21 14.8 12 20 12 20Z"/></svg></button>
<button id="fullscreen" title="Pantalla completa" aria-label="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></svg></button>
</nav></div>
<div class="message" id="message" role="status" aria-live="polite"><span></span></div>
<div class="loading" id="loading">Un universo para ti…</div>
<script>
'use strict';
(()=>{
const canvas=document.getElementById('universe'),ctx=canvas.getContext('2d',{alpha:false});
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let W=0,H=0,DPR=1,angle=.12,tilt=.27,targetTilt=.27,distance=730,targetDistance=730,paused=reduced.matches,last=0,time=0,dragging=false,userUntil=0,messageTimer,reason=0;
const TAU=Math.PI*2,mobile=innerWidth<700,amount=mobile?6500:10500;
let seed=72817;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const particles=[],stars=[],heart=[],objects=[];
const phrases=['Mi universo','Eres mi paz','Mi mayor suerte','Mi lugar favorito','Siempre a tu lado','Mi mejor versión','Mi cielo','Mi gravedad','Eres mi hogar','Contigo por siempre','Mi persona favorita','Mi bonito destino','Mi alegría','Mi sueño hecho realidad','Tú y yo','Mi amor infinito','Qué suerte encontrarte','Todas mis estrellas','Mi razón de sonreír','Eres mi todo','Donde quiero estar','Te elegiría otra vez','Mi casualidad más bonita','Mi presente y mi futuro'];
const colors=['#ffc1eb','#ead5ff','#ffa5d0','#ffe0a5'];
const glow=document.createElement('canvas');glow.width=glow.height=64;let g=glow.getContext('2d');let grad=g.createRadialGradient(32,32,0,32,32,32);grad.addColorStop(0,'#fff');grad.addColorStop(.12,'#fff3fa');grad.addColorStop(.3,'#ffb7e9bb');grad.addColorStop(.58,'#ff46af44');grad.addColorStop(1,'#ff168f00');g.fillStyle=grad;g.fillRect(0,0,64,64);
function sprite(kind){const c=document.createElement('canvas');c.width=c.height=128;const s=c.getContext('2d');s.lineWidth=3;s.strokeStyle='#322034';
if(kind===0){s.fillStyle='#fff6fc';s.beginPath();s.moveTo(24,46);s.lineTo(25,15);s.lineTo(45,28);s.quadraticCurveTo(64,18,84,28);s.lineTo(104,15);s.lineTo(105,47);s.bezierCurveTo(127,96,3,96,24,46);s.fill();s.stroke();s.fillStyle='#ffd6e9';s.beginPath();s.ellipse(64,98,25,24,0,0,TAU);s.fill();s.stroke();s.fillStyle='#291b2d';for(const x of [44,84]){s.beginPath();s.ellipse(x,52,3.5,5,0,0,TAU);s.fill()}s.fillStyle='#ffe28c';s.beginPath();s.ellipse(64,61,4,3,0,0,TAU);s.fill();s.strokeStyle='#654259';s.lineWidth=2;for(const x of [20,89])for(let y=54;y<73;y+=9){s.beginPath();s.moveTo(x,y);s.lineTo(x+19,y+1);s.stroke()}s.fillStyle='#ff58aa';for(const x of [85,105]){s.beginPath();s.ellipse(x,30,11,9,0,0,TAU);s.fill();s.stroke()}s.beginPath();s.arc(95,30,5,0,TAU);s.fill();s.stroke();}
else{s.fillStyle='#f12866';s.beginPath();s.ellipse(64,47,31,35,0,0,TAU);s.fill();s.stroke();s.fillStyle='#273165';s.beginPath();s.roundRect(45,84,38,29,8);s.fill();s.fillStyle='#f12866';s.beginPath();s.roundRect(43,79,42,24,9);s.fill();s.beginPath();s.roundRect(27,88,13,24,7);s.roundRect(88,88,13,24,7);s.roundRect(44,106,16,19,6);s.roundRect(69,106,16,19,6);s.fill();s.strokeStyle='#9c1546';s.lineWidth=1.3;for(let y=28;y<74;y+=12){s.beginPath();s.moveTo(37,y);s.quadraticCurveTo(64,y+15,92,y);s.stroke()}for(const x of [48,64,80]){s.beginPath();s.moveTo(64,17);s.lineTo(x,78);s.stroke()}s.fillStyle='#fff9ff';s.strokeStyle='#27182d';s.lineWidth=3;s.beginPath();s.moveTo(39,37);s.quadraticCurveTo(56,38,57,56);s.quadraticCurveTo(38,65,39,37);s.fill();s.stroke();s.beginPath();s.moveTo(89,37);s.quadraticCurveTo(72,38,71,56);s.quadraticCurveTo(90,65,89,37);s.fill();s.stroke();}
return c;}
const sprites=[sprite(0),sprite(1)];
for(let i=0;i<amount;i++){const r=35+Math.pow(rand(),.65)*520,arm=i%3,theta=arm*TAU/3+r*.009+(rand()-.5)*(.3+r*.0007);particles.push({x:Math.cos(theta)*r,y:(rand()-.5)*(9+r*.026),z:Math.sin(theta)*r,size:rand()>.985?3+rand()*3:.35+rand()*1.3,phase:rand()*TAU,tone:rand()});}
for(let i=0;i<700;i++)stars.push({x:rand(),y:rand(),size:.2+rand()*1.1,phase:rand()*TAU});
for(let i=0;i<1800;i++){const t=rand()*TAU,jitter=rand()*4-2;heart.push({x:(16*Math.pow(Math.sin(t),3))*5+(rand()-.5)*5,y:(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*5+50+jitter,z:(rand()-.5)*9,size:.6+rand()*1.1,phase:rand()*TAU});}
phrases.forEach((text,i)=>{const a=i*2.39996,r=150+(i%4)*92;objects.push({type:'text',text,x:Math.cos(a)*r,y:18+(i%3)*17,z:Math.sin(a)*r,color:colors[i%4],size:15+(i%3)*2});});
for(let i=0;i<16;i++){let a=i*2.39996+.9,r=145+(i%5)*70;objects.push({type:'sprite',image:sprites[i%2],x:Math.cos(a)*r,y:32+(i%3)*20,z:Math.sin(a)*r,size:42+(i%3)*7});}
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,1.65);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
let ca,sa,ct,st,focal,cx,cy;
function project(x,y,z){const rx=x*ca-z*sa,rz=x*sa+z*ca,ry=y*ct-rz*st,depth=distance-y*st-rz*ct;if(depth<40)return null;const scale=focal/depth;return{x:cx+rx*scale,y:cy-ry*scale,scale,depth};}
function draw(now){let dt=Math.min((now-last)/1000,.05)||.016;last=now;if(!document.hidden&&!paused&&!dragging){time+=dt;if(now>userUntil){angle+=dt*.08;targetTilt=.27+Math.sin(time*.17)*.19;}}distance+=(targetDistance-distance)*.075;tilt+=(targetTilt-tilt)*.07;
ca=Math.cos(angle);sa=Math.sin(angle);ct=Math.cos(tilt);st=Math.sin(tilt);focal=Math.min(W,H)*1.04;cx=W*.5;cy=H*.51;
ctx.fillStyle='#050208';ctx.fillRect(0,0,W,H);const nebula=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.56);nebula.addColorStop(0,'#18081c');nebula.addColorStop(.46,'#0c0613');nebula.addColorStop(1,'#050208');ctx.fillStyle=nebula;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#ddd5ec';for(const s of stars){ctx.globalAlpha=.23+.4*(.5+.5*Math.sin(time*.6+s.phase));ctx.fillRect(s.x*W,s.y*H,s.size,s.size);}ctx.globalAlpha=1;
ctx.globalCompositeOperation='lighter';
for(const p of particles){const q=project(p.x,p.y,p.z);if(!q||q.x<-30||q.x>W+30||q.y<-30||q.y>H+30)continue;let size=p.size*q.scale;ctx.globalAlpha=Math.min(.9,.35+q.scale*.2)*(.8+.2*Math.sin(time*1.2+p.phase));if(p.size>2.5){size=Math.min(size*9,65);ctx.drawImage(glow,q.x-size/2,q.y-size/2,size,size);}else{ctx.fillStyle=p.tone>.72?'#ffd5ef':p.tone>.45?'#ff88d1':'#bc75bd';ctx.fillRect(q.x,q.y,Math.max(.55,size),Math.max(.55,size));}}
const beat=1+Math.sin(time*2.1)*.035;
for(const p of heart){const q=project(p.x*beat,p.y*beat,p.z);if(!q)continue;ctx.globalAlpha=.65+.3*Math.sin(p.phase+time);let s=p.size*q.scale*6;ctx.drawImage(glow,q.x-s/2,q.y-s/2,s,s);ctx.fillStyle='#ff1b97';ctx.fillRect(q.x,q.y,Math.max(.8,q.scale),Math.max(.8,q.scale));}
ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
const visible=objects.map(o=>({o,q:project(o.x,o.y+(paused?0:Math.sin(time*.8+o.x)*3),o.z)})).filter(item=>item.q).sort((a,b)=>b.q.depth-a.q.depth);
for(const {o,q} of visible){if(q.x<-120||q.x>W+120||q.y<-100||q.y>H+100)continue;const opacity=Math.min(1,.25+q.scale*.65);ctx.globalAlpha=opacity;if(o.type==='sprite'){const s=Math.min(115,o.size*q.scale);ctx.drawImage(o.image,q.x-s/2,q.y-s/2,s,s);}else{const s=Math.min(29,Math.max(7,o.size*q.scale));ctx.font=`italic 500 ${s}px Georgia, serif`;ctx.textAlign='center';ctx.fillStyle=o.color;ctx.shadowColor='#ba2779';ctx.shadowBlur=6;ctx.fillText(o.text,q.x,q.y);ctx.shadowBlur=0;}}
ctx.globalAlpha=1;requestAnimationFrame(draw);
}
function zoom(factor){targetDistance=Math.max(410,Math.min(1550,targetDistance*factor));}
const pointers=new Map();let previousPinch=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});dragging=true;userUntil=performance.now()+5000;document.getElementById('hint').style.opacity='.45';});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const [a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(previousPinch)zoom(previousPinch/d);previousPinch=d;}else{angle-=(e.clientX-prev.x)*.005;targetTilt=Math.max(-.4,Math.min(1.2,targetTilt+(e.clientY-prev.y)*.003));}});
function release(e){pointers.delete(e.pointerId);dragging=pointers.size>0;previousPinch=0;userUntil=performance.now()+5000;}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(e.deltaY*.0007));},{passive:false});
canvas.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')angle-=.1;if(e.key==='ArrowRight')angle+=.1;if(e.key==='ArrowUp')targetTilt=Math.min(1.2,targetTilt+.08);if(e.key==='ArrowDown')targetTilt=Math.max(-.4,targetTilt-.08);if(e.key==='+'||e.key==='=')zoom(.9);if(e.key==='-')zoom(1.1);if(e.key===' ')setPaused(!paused);userUntil=performance.now()+5000;});
function setPaused(value){paused=value;const b=document.getElementById('motion');b.setAttribute('aria-pressed',String(paused));b.setAttribute('aria-label',paused?'Reanudar movimiento':'Pausar movimiento');b.title=paused?'Reanudar movimiento':'Pausar movimiento';b.innerHTML=paused?'<svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>';}
document.getElementById('motion').onclick=()=>setPaused(!paused);document.getElementById('zoomIn').onclick=()=>zoom(.84);document.getElementById('zoomOut').onclick=()=>zoom(1.19);
document.getElementById('reset').onclick=()=>{angle=.12;targetTilt=.27;targetDistance=730;time=0;userUntil=performance.now()+1500;};
const reasons=['En un universo infinito, te encontré a ti.','Eres mi lugar favorito.','Te elegiría en todas mis vidas.','Contigo, todo brilla un poco más.','Tú eres mi mejor casualidad.','Mi mundo es más bonito contigo.'];
document.getElementById('love').onclick=()=>{const el=document.getElementById('message');clearTimeout(messageTimer);el.querySelector('span').textContent=reasons[reason++%reasons.length];el.classList.add('active');messageTimer=setTimeout(()=>el.classList.remove('active'),4000);};
const fs=document.getElementById('fullscreen');if(!document.documentElement.requestFullscreen)fs.hidden=true;fs.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.getElementById('hint').textContent='Tu navegador no permite pantalla completa';}};
document.addEventListener('fullscreenchange',()=>fs.setAttribute('aria-label',document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa'));
reduced.addEventListener('change',e=>setPaused(e.matches));setPaused(paused);requestAnimationFrame(draw);requestAnimationFrame(()=>document.getElementById('loading').classList.add('ready'));
})();
</script>
</body>
</html>
